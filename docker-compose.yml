# readlab: the API (serves the app too), the queue worker, and Postgres.
#   docker compose up -d --build        then open http://127.0.0.1:8080
#   docker compose up -d db             just the database, for running the app from ./run.sh
# Book files and job outputs live in ./sources (bind-mounted), so local runs and containers share them.
# The database password comes from POSTGRES_PASSWORD in .env (see .env.example).
name: readlab

x-app: &app
  build: .
  image: readlab-app
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://readlab:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/readlab
  volumes:
    - ./sources:/app/sources
    - ./.cache:/app/.cache
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: readlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: readlab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readlab -d readlab"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "-m", "app.backend.cli", "migrate"]
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--workers", "2"]
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.backend.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

volumes:
  pgdata:
