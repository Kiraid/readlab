# Harness configuration: providers, prices, and which model each node uses.
# Prices are USD per 1M tokens, copied from the providers' docs on the date shown. Re-check before relying on
# them; the ledger computes cost from this table, so a wrong price means a wrong report.

providers:
  deepseek:
    kind: openai-compatible
    base_url: https://api.deepseek.com
    key_env: DEEPSEEK_API_KEY
    # https://api-docs.deepseek.com/quick_start/pricing.md, read 2026-11-06. Off-peak is half of peak.
    # Peak hours: 01:00-04:00 and 06:00-10:00 UTC, Monday to Friday (except Chinese public holidays).
    prices:
      deepseek-flash:  {cache_hit: 0.006, cache_miss: 0.30, output: 1.20, offpeak_factor: 0.5}
      deepseek-v4-pro: {cache_hit: 0.044, cache_miss: 1.32, output: 3.96, offpeak_factor: 0.5}
    peak_utc: [[1, 4], [6, 10]]   # weekdays only

  replay:
    kind: replay   # returns stored outputs; for testing the graph without an API key

# Model per node. `thinking: false` turns reasoning off (DeepSeek: thinking {type: disabled}).
nodes:
  probe:  {provider: deepseek, model: deepseek-flash, thinking: false, max_tokens: 3000}    # questions for the reader on upload, JSON
  digest: {provider: deepseek, model: deepseek-flash, thinking: false, max_tokens: 4000}    # one per chunk, JSON
  plan:   {provider: deepseek, model: deepseek-flash, thinking: true, max_tokens: 48000}    # one per chapter, JSON. v4-pro: 3.3x slower, 5.6x dearer, no better briefs (KiA ch14, 2026-11-06)
  write:  {provider: deepseek, model: deepseek-flash, thinking: true, max_tokens: 32000}    # one per chunk
  fix:    {provider: deepseek, model: deepseek-flash, thinking: false, max_tokens: 8000}    # only when the checker fails
  correct: {provider: deepseek, model: deepseek-flash, thinking: true, max_tokens: 16000}  # only when the judge finds errors; thinks, to redo the arithmetic
  judge:  {provider: deepseek, model: deepseek-flash, thinking: true, max_tokens: 16000}    # one per section, JSON. 8000: long DDIA sections spent it all thinking

run:
  max_fix_rounds: 2          # validate -> fix -> validate, at most this many fixes
  budget_usd: 2.00           # eval runs and jobs stop starting model calls once their ledger passes this
  max_concurrency: 12        # parallel branches inside a job (DeepSeek has no hard rate limit; 12 covers most chapters at once)
  timeout_s: 600
