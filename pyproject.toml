[project]
name = "readlab"
version = "0.1.0"
description = "Turn technical text into interactive study pages with a cost-measured agent pipeline."
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",   # MIT: text spans with font name/size
    "pypdf>=5.0",         # BSD: PDF outline (bookmarks) -> section page ranges
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",        # provider calls
    "langgraph>=0.2",     # the pipeline graph
    "python-multipart>=0.0.9",  # file uploads in the API
    "sqlalchemy>=2.0.36",       # MIT: models and queries over Postgres
    "psycopg[binary]>=3.2",     # LGPL: Postgres driver (sync, plus async LISTEN for live job events)
    "alembic>=1.14",            # MIT: schema migrations
    "pypdfium2>=4.30",          # Apache/BSD: cover render and fast per-page word counts
    "pillow>=10.4",             # cover image encoding
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
